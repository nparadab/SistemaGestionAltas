# SonarQube Project Configuration
# Sistema de Gestión Atlas - CreaLab SpA
# Asignatura: ISY1102 - Seguridad y Calidad en el Desarrollo de Software

sonar.projectKey=sistema-atlas-crealab
sonar.projectName=Sistema de Gestión Atlas (CreaLab SpA)
sonar.projectVersion=1.2.0

# Source paths
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=node_modules/**,uploads/**,public/**

# Language settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Profile and Security Rules
# Standards: ISO/IEC 25010, ISO/IEC 27001, OWASP Top 10, CWE
sonar.qualitygate.wait=false

# Git SCM Integration & Repository Links
sonar.scm.provider=git
sonar.scm.disabled=false
sonar.links.homepage=https://github.com/nparadab/SistemaGestionAltas
sonar.links.ci=https://github.com/nparadab/SistemaGestionAltas/actions
sonar.links.scm=https://github.com/nparadab/SistemaGestionAltas.git

